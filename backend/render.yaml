services:
  - type: web
    name: inventory-management-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HIGH_VALUE_THRESHOLD
        value: "500.00"
      - key: FRONTEND_URL
        sync: false
